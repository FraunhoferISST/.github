name: License and Copyright Compliance
description: Check REUSE metadata, license text consistency, and changed-file copyright years

inputs:
  base-sha:
    description: Base commit for the changed-file copyright year check
    required: false
  check-copyright-years:
    description: Check changed files for copyright years ending in the current UTC year
    default: 'true'
  check-license-text:
    description: Compare license-file and reference-license-file
    default: 'true'
  license-file:
    description: Repository license file to compare with reference-license-file
    default: LICENSE
  reference-license-file:
    description: Repository reference license file to compare with license-file
    required: false

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        CHECK_YEARS: ${{ inputs.check-copyright-years }}
        CHECK_LICENSE_TEXT: ${{ inputs.check-license-text }}
        BASE_SHA: ${{ inputs.base-sha }}
        LICENSE_FILE: ${{ inputs.license-file }}
        REFERENCE_LICENSE_FILE: ${{ inputs.reference-license-file }}
      run: |
        if [ "$CHECK_YEARS" != 'true' ] && [ "$CHECK_YEARS" != 'false' ]; then
          echo "::error::check-copyright-years must be 'true' or 'false'"
          exit 1
        fi
        if [ "$CHECK_LICENSE_TEXT" != 'true' ] && [ "$CHECK_LICENSE_TEXT" != 'false' ]; then
          echo "::error::check-license-text must be 'true' or 'false'"
          exit 1
        fi
        if [ "$CHECK_YEARS" = 'true' ] && [ -z "$BASE_SHA" ]; then
          echo "::error::base-sha is required when check-copyright-years is true"
          exit 1
        fi
        if [ "$CHECK_LICENSE_TEXT" = 'true' ] && { [ -z "$LICENSE_FILE" ] || [ -z "$REFERENCE_LICENSE_FILE" ]; }; then
          echo "::error::license-file and reference-license-file are required when check-license-text is true"
          exit 1
        fi

    - name: Check license text consistency
      if: inputs.check-license-text == 'true'
      shell: bash
      env:
        LICENSE_FILE: ${{ inputs.license-file }}
        REFERENCE_LICENSE_FILE: ${{ inputs.reference-license-file }}
      run: |
        if ! cmp -- "$LICENSE_FILE" "$REFERENCE_LICENSE_FILE"; then
          echo "::error::The configured license files must exist and be identical."
          exit 1
        fi

    - name: Check REUSE compliance
      uses: fsfe/reuse-action@v6

    - name: Check copyright years
      if: inputs.check-copyright-years == 'true'
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base-sha }}
        ACTION_PATH: ${{ github.action_path }}
      run: python3 "$ACTION_PATH/check-copyright-year.py" "$BASE_SHA"